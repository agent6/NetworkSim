      text: |-
        DMVPN Phase 3
        Single hub, three dynamic spokes
        ISP routes WAN only; EIGRP 100 routes LANs
        Overlay 10.10.10.0/24, GRE key 123
        NHRP auth: lesson; invented PSK: dmvpn-lab
        SPOKE1: ping 172.16.3.1 source 172.16.2.1
        show dmvpn / show ip nhrp / show ip cef
        IPsec is a logical model, not encryption.
