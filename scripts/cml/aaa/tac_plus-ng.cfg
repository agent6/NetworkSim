# Dedicated isolated lab only. Public synthetic identities and shared key.
id = spawnd {
 background = no
 listen { address = 192.168.100.10 port = 49 }
 spawn { instances min = 1 instances max = 4 }
}
id = tac_plus-ng {
 log authc { destination = ">/tmp/tacacs-authc.log" }
 log authz { destination = ">/tmp/tacacs-authz.log" }
 log acct { destination = ">/tmp/tacacs-acct.log" }
 authentication log = authc
 authorization log = authz
 accounting log = acct
 host netsim { address = 192.168.100.0/24 key = LabShared42 }
 profile admin {
  script {
   if (service == shell) {
    if (cmd == "") {
     set priv-lvl = 15
     if (device.address == 192.168.100.2) add shell:roles = '"network-admin"'
    }
    permit
   }
  }
 }
 profile operator {
  script {
   if (service == shell) {
    if (cmd == "") {
     set priv-lvl = 1
     if (device.address == 192.168.100.2) add shell:roles = '"network-operator"'
    }
    permit
   }
  }
 }
 profile denied { script { deny } }
 user remote { password login = clear "RemotePass42!" password pap = login profile = admin }
 user viewer { password login = clear "Operator42!" password pap = login profile = operator }
 user noexec { password login = clear "NoExec42!" password pap = login profile = denied }
}
